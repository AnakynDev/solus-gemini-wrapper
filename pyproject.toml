[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solus"
version = "0.1.0"
description = "Browser-automation client for chatting with Gemini via Playwright"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]
